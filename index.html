<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Suppress benign Vite HMR WebSocket closing errors in AI Studio iframe dev environments
      (function() {
        const origConsoleError = console.error;
        console.error = function(...args) {
          const msg = args.map(a => String(a && a.message ? a.message : a)).join(' ');
          if (msg.includes('WebSocket') || msg.includes('[vite]')) {
            return;
          }
          origConsoleError.apply(console, args);
        };
        window.addEventListener('error', function(event) {
          if (event.message && (event.message.includes('WebSocket') || event.message.includes('[vite]'))) {
            event.preventDefault();
            event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          if (event.reason && String(event.reason).includes('WebSocket')) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
